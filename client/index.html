<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diplomatio 3.0 light</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/client/style.css">
<link rel="stylesheet" href="/client/lobby.css">
<link rel="stylesheet" href="/client/chat.css">
<link rel="stylesheet" href="/client/replay.css">
</head>
<body>
<div id="toast" hidden></div>

<section id="screen-start" class="screen lobby-screen" hidden>
  <h1>Diplomatio <small>3.0 light</small></h1>
  <p class="lead">Wähle eine Karte und lade deine Mitspieler ein.</p>
  <div id="st-maps" class="map-tiles"></div>
  <button id="st-create" class="primary big">Spiel erstellen</button>
  <p id="st-msg" class="msg"></p>
</section>

<section id="screen-join" class="screen lobby-screen" hidden>
  <h1>Spiel beitreten</h1>
  <label class="field">Dein Name <input id="jn-name" maxlength="30" placeholder="Name eingeben" autocomplete="nickname"></label>
  <div class="split">
    <div id="jn-nations" class="nation-grid"></div>
    <div id="jn-mini" class="mini"></div>
  </div>
  <button id="jn-go" class="primary big">Beitreten</button>
  <p id="jn-msg" class="msg"></p>
</section>

<section id="screen-lobby" class="screen lobby-screen" hidden>
  <h1>Lobby <small id="lb-map"></small></h1>
  <div class="split">
    <ul id="lb-list" class="players"></ul>
    <div id="lb-mini" class="mini"></div>
  </div>
  <div class="linkrow">
    <input id="lb-link" readonly aria-label="Einladungslink">
    <button id="lb-copy">Link kopieren</button>
  </div>
  <details id="lb-rules" class="rules"><summary>Regeln</summary><ul id="lb-rules-list"></ul></details>
  <button id="lb-start" class="primary big" hidden>Spiel starten</button>
  <p id="lb-wait" class="waiting" hidden>Warten auf den Host <span class="dots"><i>.</i><i>.</i><i>.</i></span></p>
  <p id="lb-msg" class="msg"></p>
</section>

<section id="screen-game" hidden>
  <header id="topbar">
    <b id="tb-turn"></b> <span id="tb-timer"></span>
    <span id="tb-order"></span>
    <span id="tb-gold"></span>
    <span id="tb-rec"></span>
    <span id="tb-sum"></span>
    <button id="btn-ready" class="primary">Bereit</button>
    <span id="tb-idle" class="msg"></span>
    <span id="conn" class="msg"></span>
  </header>
  <main id="gamebody">
    <div id="mapwrap">
      <div id="mapbox">
        <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="tip" hidden></div>
        <div id="ctxmenu" hidden></div>
      </div>
      <div id="toolbar" hidden></div>
      <div id="infobar"><div id="ib-hover"></div><div id="ib-hint"></div></div>
      <div id="replay"></div>
    </div>
    <aside id="side">
      <div id="chat"></div>
      <div id="olist"></div>
      <table id="board"></table>
    </aside>
  </main>
</section>

<script type="module" src="/client/app.js"></script>
</body>
</html>
