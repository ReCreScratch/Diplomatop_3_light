<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diplomatio 3.0 light</title>
<link rel="stylesheet" href="/client/style.css">
</head>
<body>
<div id="toast" hidden></div>

<section id="screen-start" class="screen" hidden>
  <h1>Diplomatio 3.0 light</h1>
  <label>Karte <select id="st-map"></select></label>
  <button id="st-create" class="primary">Spiel erstellen</button>
  <p id="st-msg" class="msg"></p>
</section>

<section id="screen-join" class="screen" hidden>
  <h1>Spiel beitreten</h1>
  <label>Name <input id="jn-name" maxlength="30"></label>
  <label>Nation <select id="jn-nation"></select></label>
  <button id="jn-go" class="primary">Beitreten</button>
  <p id="jn-msg" class="msg"></p>
</section>

<section id="screen-lobby" class="screen" hidden>
  <h1>Lobby</h1>
  <p>Einladungslink: <input id="lb-link" readonly size="50"></p>
  <ul id="lb-list"></ul>
  <button id="lb-start" class="primary" hidden>Spiel starten</button>
  <p id="lb-msg" class="msg"></p>
</section>

<section id="screen-game" hidden>
  <header id="topbar">
    <b id="tb-turn"></b> <span id="tb-timer"></span>
    <span id="tb-order"></span>
    <span id="tb-gold"></span>
    <span id="tb-sum"></span>
    <button id="btn-ready" class="primary">Bereit</button>
    <span id="conn" class="msg"></span>
  </header>
  <main id="gamebody">
    <div id="mapwrap">
      <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="infobar"><div id="ib-hover"></div><div id="ib-preview"></div></div>
      <div id="replay"></div>
    </div>
    <aside id="side">
      <div id="panel" hidden></div>
      <table id="board"></table>
    </aside>
  </main>
</section>

<script type="module" src="/client/app.js"></script>
</body>
</html>
